<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Upload tự động khi chọn ảnh</title>
</head>
<body>

<form id="uploadForm" action="/upload" method="post" enctype="multipart/form-data">
  Bạn chọn 1 ảnh để làm profile:
  <input type="file" name="fileToUpload" id="fileToUpload">
</form>

<script>
  document.getElementById('fileToUpload').addEventListener('change', function () {
    document.getElementById('uploadForm').submit(); // Tự động gửi form
  });
</script>

</body>
</html>
